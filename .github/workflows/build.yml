name: Build R3muxTool

# Builds the title against the latest RXDK (clang, SDK, host tools) on Windows,
# then publishes the same rolling "latest" release the RXDK repos use: a push to
# main deletes and recreates the latest tag so /releases/latest is always this
# build. A v* tag is a fixed release. workflow_dispatch with release_tag is a
# prerelease. Pull requests build and upload artifacts, and do not publish.

on:
  push:
    branches: [main, master]
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Create a GitHub Release with this tag (e.g. v1.0.0). Leave empty to build only.'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Stage RXDK clang, SDK, and host tools
        shell: pwsh
        run: ./scripts/stage-rxdk.ps1

      - name: Build (Release)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & 'C:\ProgramData\RXDK\tools\Rxdk.Cli.exe' build --project-root . --configuration Release
          if ($LASTEXITCODE -ne 0) { throw 'rxdk build failed' }
          foreach ($f in 'out/Release/R3muxTool.xbe', 'out/Release/XISO/R3muxTool.iso',
                         'out/Release/Build/R3muxTool/default.xbe', 'out/Release/Build/R3muxTool/Media/Font.xpr') {
            if (-not (Test-Path $f)) { throw "$f was not produced" }
          }

      - name: Package release files
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item out/Release/XISO/R3muxTool.iso dist/R3muxTool.iso
          # default.xbe + Media/, ready to copy to the Xbox hard drive.
          Compress-Archive -Path out/Release/Build/R3muxTool -DestinationPath dist/R3muxTool.zip -Force

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: r3muxtool
          path: dist/*
          if-no-files-found: error
          retention-days: 90

  release:
    name: GitHub Release
    needs: [build]
    if: |
      github.event_name != 'pull_request' && (
        startsWith(github.ref, 'refs/tags/v') ||
        (github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag != '') ||
        (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'))
      )
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build
        uses: actions/download-artifact@v4
        with:
          name: r3muxtool
          path: dist

      - name: Resolve release tag
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          moving=false
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            tag="${GITHUB_REF#refs/tags/}"
            prerelease=false
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${{ github.event.inputs.release_tag }}" ]]; then
            tag="${{ github.event.inputs.release_tag }}"
            prerelease=true
          else
            # Push to main: one moving "latest" release so /releases/latest stays current.
            tag="latest"
            prerelease=false
            moving=true
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "moving=$moving" >> "$GITHUB_OUTPUT"
          echo "Release tag: $tag (prerelease=$prerelease, moving=$moving)"

      - name: Move the 'latest' tag/release to this build
        if: steps.meta.outputs.moving == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete latest --repo "${{ github.repository }}" --cleanup-tag --yes || true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: R3muxTool ${{ steps.meta.outputs.tag }}
          prerelease: ${{ steps.meta.outputs.prerelease }}
          make_latest: ${{ steps.meta.outputs.prerelease == 'false' }}
          body: |
            Xecuter 3 LCD / bank switch tool for the original Xbox, built with RXDK.

            - `R3muxTool.zip` — `default.xbe` + `Media/`; copy the folder to your Xbox hard drive (e.g. `E:\Apps\R3muxTool`) and launch it from your dashboard
            - `R3muxTool.iso` — XISO for xemu or an ODE / burned disc
          files: |
            dist/*
